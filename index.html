<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogos IFC</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <a class="brand" href="#inicio" data-page="inicio" aria-label="Jogos IFC — início">
          <span class="brand-copy"><strong>jogos<span>ifc</span></strong><small>ESPORTE QUE CONECTA</small></span>
        </a>

        <div class="season-label">EDIÇÃO 2025 <span class="season-year">·</span></div>
        <nav class="main-nav">
          <span class="nav-caption">MENU PRINCIPAL</span>
          <button class="nav-link active" data-page="inicio"><span class="nav-icon">⌂</span>Visão geral</button>
          <button class="nav-link" data-page="calendario"><span class="nav-icon">▦</span>Calendário</button>
          <button class="nav-link" data-page="atletismo"><span class="nav-icon">↗</span>Atletismo</button>
          <button class="nav-link" data-page="podios"><span class="nav-icon">♜</span>Pódios</button>
          <button class="nav-link" data-page="atletas"><span class="nav-icon">♙</span>Atletas</button>
          <button class="nav-link" data-page="campus"><span class="nav-icon">⌖</span>Campus</button>
          <button class="nav-link" data-page="modalidades"><span class="nav-icon">◈</span>Modalidades</button>
        </nav>

        <div class="sidebar-bottom">
          <div class="help-card">
            <span class="help-spark">✳</span>
            <strong>Faz parte dos jogos?</strong>
            <p>Acesso demonstrativo exclusivo para servidor e administrador.</p>
            <button class="text-button" data-open-auth="login">Acessar área restrita <span>↗</span></button>
          </div>
          <button class="profile-button" data-open-auth="login">
            <span class="profile-avatar">IFC</span>
            <span class="profile-label"><strong>Área de edição</strong><small>Servidor e administrador</small></span>
            <span class="profile-arrow">↗</span>
          </button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Jogos IFC</span><span class="breadcrumb-divider">/</span><strong id="breadcrumb-current">Visão geral</strong></div>
          <div class="topbar-actions">
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Ativar modo escuro" aria-pressed="false" title="Ativar modo escuro"><span aria-hidden="true">☾</span><span class="theme-label">Modo escuro</span></button>
            <span class="edition-pill">JIFC 2025</span>
            <button class="icon-button" aria-label="Notificações" title="Notificações">♧<span class="notification-dot"></span></button>
            <button class="top-avatar" data-open-auth="login" aria-label="Acesso restrito">IFC</button>
          </div>
        </header>

        <div id="page-content" class="page-content"></div>
        <footer class="site-footer"><span class="footer-logo">jogos<span>ifc</span></span><span>Instituto Federal Catarinense · Esporte, integração e comunidade.</span><span>Feito para jogar junto <span class="footer-heart">♥</span></span></footer>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
