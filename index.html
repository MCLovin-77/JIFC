<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JIFC</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <a
          class="brand"
          href="#inicio"
          data-page="inicio"
          aria-label="JIFC — início"
        >
          <span class="brand-copy">
            <strong><span>JIFC</span></strong>
          </span>
        </a>

        <div class="season-label">
          EDIÇÃO 2025 <span class="season-year">·</span>
        </div>

        <nav class="main-nav">
          <span class="nav-caption">MENU PRINCIPAL</span>
          <button class="nav-link active" data-page="inicio">
            Visão geral
          </button>
          <button class="nav-link" data-page="calendario">
            Calendário
          </button>
          <button class="nav-link" data-page="podios">
            Pódios
          </button>
          <button class="nav-link" data-page="atletas">
            Atletas
          </button>
          <button class="nav-link" data-page="campus">
            Campus
          </button>
          <button class="nav-link" data-page="modalidades">
            Modalidades
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="help-card">
            <strong>Faz parte dos jogos?</strong>
            <p>Acesso exclusivo para servidor e administrador.</p>
            <button class="text-button" data-open-auth="login">
              Acessar área restrita
            </button>
          </div>

          <button class="profile-button" data-open-auth="login">
            <span class="profile-avatar">IFC</span>
            <span class="profile-label">
              <strong>Área de edição</strong>
              <small>Servidor e administrador</small>
            </span>
          </button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb">
            <span>JIFC</span>
            <span class="breadcrumb-divider">/</span>
            <strong id="breadcrumb-current">Visão geral</strong>
          </div>

          <div class="topbar-actions">
            <button
              class="theme-toggle"
              id="theme-toggle"
              type="button"
              aria-label="Ativar modo escuro"
              aria-pressed="false"
              title="Ativar modo escuro"
            >
              <span class="theme-label">Modo escuro</span>
            </button>
            <span class="edition-pill">JIFC 2025</span>
           
            <button
              class="top-avatar"
              data-open-auth="login"
              aria-label="Acesso restrito"
            >
              IFC
            </button>
          </div>
        </header>

        <div id="page-content" class="page-content"></div>
        <footer class="site-footer">
          <span class="footer-logo"><span>JIFC</span></span>
          <span>Instituto Federal Catarinense</span>
        </footer>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <script src="assets/media.js"></script>
    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/screens/home.js"></script>
    <script src="js/screens/athletes.js"></script>
    <script src="js/screens/calendar.js"></script>
    <script src="js/screens/athletics.js"></script>
    <script src="js/screens/podiums.js"></script>
    <script src="js/screens/campuses.js"></script>
    <script src="js/screens/modalities.js"></script>
    <script src="js/screens/modality-details.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/editor/fields.js"></script>
    <script src="js/editor/server.js"></script>
    <script src="js/editor/admin.js"></script>
    <script src="js/editor.js"></script>
    <script src="app.js"></script>
  </body>
</html>
